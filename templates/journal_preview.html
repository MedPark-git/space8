{% set document_id = 'journal-modal-document-' ~ journal.id %}
<div class="meeting-preview-shell"><div class="meeting-preview-head no-print"><div><span class="journal-document-badge {{ journal.document_type }}">{{ journal.document_label }}</span><strong>{{ journal.title }}</strong><small>{{ journal.work_date }} · {{ journal.department.name }} · {{ journal.author.name }}</small></div><button type="button" data-close aria-label="상세 창 닫기">×</button></div><div class="meeting-preview-actions no-print"><button class="button primary" type="button" data-print-journal data-print-target="{{ document_id }}">A4 인쇄</button><button class="button ghost" type="button" data-download-image data-image-target="{{ document_id }}" data-image-filename="{{ journal.work_date }}-{{ journal.document_label }}-{{ journal.author.name }}">PNG 이미지 저장</button>{% if can_edit %}<a class="button ghost" href="{{ url_for('journal_edit', journal_id=journal.id) }}">수정</a>{% endif %}</div>{% include "_journal_document.html" %}</div>
