{% set document_id = 'meeting-modal-document-' ~ meeting.id %}
<div class="meeting-preview-shell">
  <div class="meeting-preview-head no-print">
    <div><span class="meeting-document-badge {{ meeting.document_type }}">{{ meeting.document_label }}</span><strong>{{ meeting.title }}</strong><small>{{ meeting.meeting_date }} · {{ meeting.department.name }}</small></div>
    <button type="button" data-close aria-label="상세 창 닫기">×</button>
  </div>
  <div class="meeting-preview-actions no-print">
    <a class="button primary" href="{{ url_for('meeting_excel', meeting_id=meeting.id) }}">Excel 양식 다운로드</a>
    <button class="button ghost" type="button" data-print-meeting data-print-target="{{ document_id }}">A4 인쇄</button>
    <button class="button ghost" type="button" data-download-image data-image-target="{{ document_id }}" data-image-filename="{{ meeting.meeting_date }}-{{ meeting.document_label }}">PNG 이미지 저장</button>
    {% if can_edit %}<a class="button ghost" href="{{ url_for('meeting_edit', meeting_id=meeting.id) }}">수정</a>{% endif %}
  </div>
  {% include "_meeting_document.html" %}
</div>
